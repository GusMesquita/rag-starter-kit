name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nenhum job aqui escreve no repositório.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: lint + test (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          # Mesma versão fixada em .mise.toml — dev e CI não divergem.
          python-version: "3.13"
          enable-cache: true
      # --locked falha se uv.lock estiver dessincronizado do pyproject.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    name: lint + build + test (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          # pnpm lê a versão do campo packageManager deste package.json.
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # --frozen-lockfile falha se o lockfile estiver dessincronizado.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          RAG_API_KEY: canario-do-ci-nao-pode-vazar
      - name: A chave não pode estar no bundle do browser
        # Se alguém trocar RAG_API_KEY por NEXT_PUBLIC_RAG_API_KEY, o valor é
        # inlinado no JS servido e este grep acha. É a garantia executável de
        # que a pergunta passa pelo Route Handler, não pelo browser.
        run: "! grep -rq canario-do-ci-nao-pode-vazar .next/static"

  security:
    name: segredos + dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks varre o histórico inteiro, não só o diff
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Exportar dependências de runtime
        run: uv export --format requirements-txt --no-emit-project --no-dev -o requirements-audit.txt
      - name: Auditar CVEs do backend
        # As 5 PYSEC do chromadb 1.5.9 (última versão, sem correção publicada)
        # estão no servidor HTTP do Chroma: exigem alcançar /api/v2/... para
        # injetar código ou burlar o RBAC de tenant. Este projeto usa
        # chromadb.PersistentClient (embarcado, em processo) e não sobe esse
        # servidor, então a superfície não existe aqui. Revisar se algum dia o
        # Chroma virar serviço separado — aí as 4 voltam a valer.
        run: |
          uvx pip-audit -r requirements-audit.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - name: Auditar CVEs do web
        working-directory: web
        run: pnpm audit --audit-level high

  docker:
    name: build da imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Prova que o Dockerfile constrói; não publica nada.
      - run: docker build -t rag-starter-kiti .
